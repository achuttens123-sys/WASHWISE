<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- WashWise Vibrant Royal Blue Gradient -->
    <linearGradient id="ww-blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b5bfd"/>
      <stop offset="100%" stop-color="#2d4af7"/>
    </linearGradient>
  </defs>

  <!-- Blue Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="118" fill="url(#ww-blue-grad)"/>

  <!-- Crisp White Outer Ring Frame -->
